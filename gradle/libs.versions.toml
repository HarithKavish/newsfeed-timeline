[versions]
# Matched to the toolchain already proven on this ecosystem's other Android
# repository (ReWeb): Gradle 8.7 / AGP 8.5.2 / Kotlin 1.9.24.
agp = "8.5.2"
kotlin = "1.9.24"

# The whole dependency list, deliberately. RecyclerView is the only one, and it
# HttpURLConnection and parses it with org.json -- both in the platform -- so
# no HTTP or JSON library is needed. RecyclerView is the one real dependency:
# view recycling is what keeps a long feed smooth, and hand-rolling it would be
# worse code for the same bytes.
recyclerview = "1.3.2"

[libraries]
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
