# Heap is deliberately modest. This project is one small module, and a larger
# JVM on a memory-constrained machine buys nothing while pushing the OS into
# growing its page file.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
